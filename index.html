<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:dark}
body{background:#050505;color:#fff;font-family:Inter,system-ui,sans-serif;min-height:100vh}
html{background:#050505}
body:before{display:none}
body.hasbg,body.hasbg #bg-media-container,body.hasbg main,body.hasbg #app{background:transparent!important}
body.hasbg .glass{background:rgba(0,0,0,.7)}
body.hasbg header.glass{background:radial-gradient(circle at 15% 50%,rgba(213,184,190,.14),transparent 50%),rgba(0,0,0,.7)}
.glass{background:rgba(0,0,0,.75);border:1px solid rgba(255,255,255,.08);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border-radius:16px}
header.glass{background:radial-gradient(circle at 15% 50%,rgba(213,184,190,.14),transparent 50%),rgba(0,0,0,.75)}
body.hasbg:before{display:none}
.stg{font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;border-radius:99px;padding:1px 8px;border:1px solid}
.brand{font-family:'Cormorant Garamond',Georgia,serif;letter-spacing:.06em;text-transform:none;color:#f3eee6;text-shadow:0 0 18px rgba(213,184,190,.35)}
.inp{background:#0c0c0e;border:1px solid rgba(255,255,255,.1);border-radius:10px;padding:8px 10px;width:100%;font-size:14px;outline:none;color:#fff}
.inp:focus{border-color:#10b981}
.btn{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);border-radius:10px;padding:7px 12px;font-size:13px;cursor:pointer;white-space:nowrap;color:#fff}
.btn:hover{background:rgba(255,255,255,.12)}
.pri{background:#10b981;color:#031;border-color:#10b981;font-weight:600}.pri:hover{background:#34d399}
.pill{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);border-radius:999px;padding:5px 13px;font-size:12px;cursor:pointer}
.tag{background:rgba(16,185,129,.12);color:#6ee7b7;border-radius:8px;padding:2px 9px;font-size:11px;cursor:pointer}
.g{color:#10b981}.r{color:#ef4444}
.tab{padding:8px 14px;border-radius:10px;font-size:13px;color:#a1a1aa;cursor:pointer;white-space:nowrap}
.tab.on{background:rgba(16,185,129,.15);color:#fff}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.78);display:flex;align-items:flex-start;justify-content:center;z-index:50;padding:12px;overflow:auto}
.hidden{display:none!important}
.sel{border-color:#10b981!important;box-shadow:0 0 24px rgba(16,185,129,.18)}
body.hide .priv{filter:blur(9px)}
label{font-size:11px;color:#a1a1aa;display:block;margin-bottom:3px}
.bar{height:6px;border-radius:4px}.lbl{font-size:11px;color:#71717a;letter-spacing:.08em;text-transform:uppercase}

/* ===== Stat-card numbers: one fixed line box, lining figures, optically centred ===== */
.num{display:flex!important;align-items:center;height:32px!important;line-height:1!important;font-variant-numeric:lining-nums tabular-nums;font-feature-settings:"calt" 0,"case" 0,"zero" 0}

/* ================= PRO UI LAYER ================= */
.mono,.priv,.num,input[type=number],input[type=date]{font-family:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace;font-variant-numeric:tabular-nums}
.glass{background:linear-gradient(145deg,rgba(255,255,255,.06),rgba(255,255,255,.012) 38%,rgba(0,0,0,.5)),rgba(8,8,10,.72);border:1px solid rgba(255,255,255,.09);box-shadow:0 8px 32px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.07);-webkit-backdrop-filter:blur(16px) saturate(140%);backdrop-filter:blur(16px) saturate(140%);transition:transform .25s cubic-bezier(.2,.8,.2,1),border-color .25s,box-shadow .25s}
body.hasbg .glass{background:linear-gradient(145deg,rgba(255,255,255,.06),rgba(255,255,255,.012) 38%,rgba(0,0,0,.45)),rgba(0,0,0,.62)}
main .glass:hover{transform:translateY(-3px);border-color:rgba(16,185,129,.38);box-shadow:0 16px 44px rgba(0,0,0,.55),0 0 0 1px rgba(16,185,129,.14),0 0 30px rgba(16,185,129,.12),inset 0 1px 0 rgba(255,255,255,.08)}
main #calCard.glass:hover,main .glass.nolift:hover{transform:none;border-color:rgba(255,255,255,.09);box-shadow:0 8px 32px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.07)}
.kpi{position:relative;overflow:hidden}
.kpi:before{content:"";position:absolute;left:12%;right:12%;top:0;height:1px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.45),transparent)}
.btn,.pill,.tab,.tag{transition:background .2s,transform .15s,box-shadow .2s,border-color .2s}
.btn:hover,.pill:hover{transform:translateY(-1px)}
.btn:active,.pill:active{transform:scale(.97)}
.pri{box-shadow:0 0 18px rgba(16,185,129,.32)}.pri:hover{box-shadow:0 0 26px rgba(16,185,129,.5)}
.gbtn{background:rgba(255,255,255,.96);color:#18181b;border-color:#fff;font-weight:600}.gbtn:hover{background:#fff;box-shadow:0 0 20px rgba(255,255,255,.28)}
.tab.on{box-shadow:inset 0 0 0 1px rgba(16,185,129,.35),0 0 16px rgba(16,185,129,.15)}
.stg{letter-spacing:.1em}
/* NY clock / session pill */
.nypill{display:inline-flex;align-items:center;gap:8px;padding:6px 13px;border-radius:999px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);font-size:12px;white-space:nowrap;box-shadow:inset 0 1px 0 rgba(255,255,255,.05)}
.nypill .dot{width:8px;height:8px;border-radius:50%;background:#10b981;animation:pulseG 1.8s infinite;flex:none}
.nypill .dot.idle{background:#f59e0b;animation:pulseA 1.8s infinite}.nypill .dot.off{background:#71717a;animation:none}
.nypill .sep{width:1px;height:12px;background:rgba(255,255,255,.18)}
.nypill #nySes{font-weight:600;letter-spacing:.04em;text-transform:uppercase;font-size:11px}
@keyframes pulseG{0%{box-shadow:0 0 0 0 rgba(16,185,129,.7)}70%{box-shadow:0 0 0 8px rgba(16,185,129,0)}100%{box-shadow:0 0 0 0 rgba(16,185,129,0)}}
@keyframes pulseA{0%{box-shadow:0 0 0 0 rgba(245,158,11,.6)}70%{box-shadow:0 0 0 8px rgba(245,158,11,0)}100%{box-shadow:0 0 0 0 rgba(245,158,11,0)}}
/* animated dual progress bars + win-rate ring */
.pbar{height:8px;border-radius:99px;background:rgba(255,255,255,.07);overflow:hidden;margin-top:5px}
.pbar>i{display:block;height:100%;border-radius:99px;width:var(--w);animation:growW 1.1s cubic-bezier(.2,.8,.2,1);position:relative}
.pbar>i:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.35),transparent);transform:translateX(-100%);animation:shimmer 2.6s 1.1s infinite}
@keyframes growW{from{width:0}}
@keyframes shimmer{to{transform:translateX(100%)}}
.ringfg{animation:ringIn 1.1s cubic-bezier(.2,.8,.2,1)}
@keyframes ringIn{from{stroke-dasharray:0 100}}
.dcell{transition:transform .2s,filter .2s}.dcell:hover{transform:translateY(-2px);filter:brightness(1.15)}
::selection{background:rgba(16,185,129,.35)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ================= LOGIN GATE ================= */
body.locked .app-shell,body.locked main,body.locked .modal{display:none!important}
body:not(.locked) #gate{display:none}
#gate{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;padding:20px;overflow:auto;background:radial-gradient(60% 50% at 50% 30%,rgba(16,185,129,.12),transparent 70%),radial-gradient(45% 40% at 85% 85%,rgba(213,184,190,.10),transparent 70%),rgba(5,5,5,.9);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
#gate .gcard{width:100%;max-width:440px;padding:40px 32px 28px;text-align:center;border-radius:24px;animation:gateIn .7s cubic-bezier(.2,.8,.2,1);box-shadow:0 30px 80px rgba(0,0,0,.65),0 0 60px rgba(16,185,129,.08),inset 0 1px 0 rgba(255,255,255,.08)}
@keyframes gateIn{from{opacity:0;transform:translateY(18px) scale(.98)}}
.gate-btn{width:100%;display:flex;align-items:center;justify-content:center;gap:12px;padding:14px 22px;font-size:15px;border-radius:14px;box-shadow:0 0 28px rgba(255,255,255,.12)}
.gate-btn:disabled{opacity:.6;cursor:wait;transform:none}
.spin{display:inline-block;width:16px;height:16px;border:2px solid rgba(255,255,255,.2);border-top-color:#10b981;border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* ================= LIGHT / DARK THEME ================= */
:root{--c-empty:rgba(18,18,20,.6);--c-bd:rgba(255,255,255,.08);--c-zbd:rgba(255,255,255,.18);--c-wk:rgba(255,255,255,.05);--c-wkbd:rgba(255,255,255,.1);--c-ibtn:rgba(255,255,255,.1)}
.thbtn{display:inline-flex;align-items:center;justify-content:center;width:36px;padding:7px 0}
.thbtn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
html[data-theme=light] .ico-sun,html:not([data-theme=light]) .ico-moon{display:none}
.lgb{display:inline-flex;flex:none;box-sizing:border-box}.lgb svg{width:100%;height:100%}
.gdiv{height:1px;margin:26px 0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.14),transparent)}
html[data-theme=light]{--c-empty:rgba(15,23,42,.04);--c-bd:rgba(15,23,42,.09);--c-zbd:rgba(15,23,42,.18);--c-wk:rgba(15,23,42,.05);--c-wkbd:rgba(15,23,42,.1);--c-ibtn:rgba(15,23,42,.08);color-scheme:light}

html[data-theme=light] body:not(.hasbg) #bg-media-container{background:#eef0f4!important}
html[data-theme=light] .glass{background:linear-gradient(145deg,rgba(255,255,255,.96),rgba(255,255,255,.74)),rgba(255,255,255,.7);border-color:rgba(15,23,42,.1);box-shadow:0 8px 28px rgba(15,23,42,.09),inset 0 1px 0 #fff}
html[data-theme=light] body.hasbg .glass{background:linear-gradient(145deg,rgba(255,255,255,.9),rgba(255,255,255,.64)),rgba(255,255,255,.55)}
html[data-theme=light] header.glass,html[data-theme=light] body.hasbg header.glass{background:radial-gradient(circle at 15% 50%,rgba(213,184,190,.3),transparent 50%),rgba(255,255,255,.9)}
html[data-theme=light] main .glass:hover{border-color:rgba(16,185,129,.5);box-shadow:0 14px 36px rgba(15,23,42,.15),0 0 0 1px rgba(16,185,129,.2),0 0 26px rgba(16,185,129,.12),inset 0 1px 0 #fff}
html[data-theme=light] main #calCard.glass:hover,html[data-theme=light] main .glass.nolift:hover{border-color:rgba(15,23,42,.1);box-shadow:0 8px 28px rgba(15,23,42,.09),inset 0 1px 0 #fff}
html[data-theme=light] .kpi:before{background:linear-gradient(90deg,transparent,rgba(16,185,129,.45),transparent)}
html[data-theme=light] .kpi circle:not(.ringfg){stroke:rgba(15,23,42,.1)}
html[data-theme=light] .brand{color:#18181b;text-shadow:none}
html[data-theme=light] .lgb{background:#0b0b0c;border-radius:9px;padding:4px}
html[data-theme=light] .inp{background:#fff;border-color:rgba(15,23,42,.18);color:#0f172a}
html[data-theme=light] .btn,html[data-theme=light] .pill{background:rgba(15,23,42,.05);border-color:rgba(15,23,42,.14);color:#18181b}
html[data-theme=light] .btn:hover,html[data-theme=light] .pill:hover{background:rgba(15,23,42,.09)}
html[data-theme=light] .btn.pri{background:#10b981;border-color:#10b981;color:#04261a}
html[data-theme=light] .btn.pri:hover{background:#34d399}
html[data-theme=light] .btn.gbtn{background:#fff;border-color:rgba(15,23,42,.18);color:#18181b;box-shadow:0 2px 10px rgba(15,23,42,.12)}
html[data-theme=light] .btn.gbtn:hover{background:#f8fafc;box-shadow:0 4px 16px rgba(15,23,42,.18)}
html[data-theme=light] .tab{color:#52525b}
html[data-theme=light] .tab.on{background:rgba(16,185,129,.16);color:#065f46}
html[data-theme=light] .tag{background:rgba(16,185,129,.14);color:#047857}
html[data-theme=light] .g{color:#059669}
html[data-theme=light] .r{color:#dc2626}
html[data-theme=light] label{color:#52525b}
html[data-theme=light] .lbl{color:#6b7280}

html[data-theme=light] .nypill .sep{background:rgba(15,23,42,.2)}
html[data-theme=light] .pbar{background:rgba(15,23,42,.09)}
html[data-theme=light] .modal{background:rgba(15,23,42,.45)}
html[data-theme=light] .text-zinc-300{color:#3f3f46}
html[data-theme=light] .text-zinc-400{color:#52525b}

html[data-theme=light] ::selection{background:rgba(16,185,129,.28)}
html[data-theme=light] #gate{background:radial-gradient(60% 50% at 50% 30%,rgba(16,185,129,.15),transparent 70%),radial-gradient(45% 40% at 85% 85%,rgba(213,184,190,.32),transparent 70%),rgba(238,240,244,.94)}
html[data-theme=light] #gate .gcard{box-shadow:0 30px 70px rgba(15,23,42,.16),0 0 50px rgba(16,185,129,.08),inset 0 1px 0 #fff}
html[data-theme=light] .gdiv{background:linear-gradient(90deg,transparent,rgba(15,23,42,.18),transparent)}
html[data-theme=light] .spin{border-color:rgba(15,23,42,.15);border-top-color:#10b981}

/* ================= CLOUD SYNC PILL ================= */
#syncPill{cursor:pointer}
.sytxt{display:none}@media (min-width:640px){.sytxt{display:inline}}
.nypill .dot.sy-sync{background:#f59e0b;animation:pulseA 1.4s infinite}

.nypill .dot.sy-off{background:#71717a;animation:none}
.nypill .dot.sy-err{background:#ef4444;animation:none}
</style></head>
<body class="locked">
<div id="bg-media-container" style="position:fixed;inset:0;z-index:0;background:#050505;overflow:hidden;pointer-events:none"></div>

<!-- LOGIN GATE: dashboard stays hidden until Firebase confirms a signed-in user -->
<div id="gate" role="dialog" aria-modal="true" aria-label="Sign in">

  </div>
</div>
<div class="app-shell relative z-10 max-w-[1500px] mx-auto px-3 pt-3"><header class="glass px-3 py-2 flex flex-wrap items-center gap-3 justify-between">

<main class="relative z-10 max-w-[1500px] mx-auto px-3 py-3">
<section data-v="dash" class="grid gap-3 lg:grid-cols-[250px_minmax(0,1fr)_290px]">
  <div id="kpi" class="lg:col-span-3 grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-4 gap-3"></div>
  <aside class="space-y-3 order-2 lg:order-none"><div id="accts" class="space-y-3"></div></aside>
  <div class="space-y-3 order-1 lg:order-none min-w-0">

    <div class="grid md:grid-cols-3 gap-3">

 if(!CR){chg.forEach(x=>{const id=idOf(x);if(x.type=='removed')delete CLD[c][id];else CLD[c][id]=x.doc.data()});
  if(!sn.metadata.fromCache){RDY[c]=true;tryReady()}return}
 let ch=false;
 chg.forEach(x=>{if(x.doc.metadata.hasPendingWrites)return;const id=idOf(x),arr=S[c],i=arr.findIndex(z=>z.id==id);
  if(x.type=='removed'){if(i>=0){arr.splice(i,1);ch=true}delete SY[c][id]}
  else{const d=x.doc.data();SY[c][id]=hs(d);const it=fixR(c,clean(d));if(i<0){arr.push(it);ch=true}else if(hs(arr[i])!==hs(it)){arr[i]=it;ch=true}}});
 if(ch){normalize();persistS();persistSY();renderSoon()}
 if(!sn.metadata.fromCache&&!sn.metadata.hasPendingWrites&&!PUSHING)setSync('ok')}
function onMeta(sn){CMETA=sn.exists?sn.data():null;
 if(!CR){if(!sn.metadata.fromCache){RDY.meta=true;tryReady()}return}
 if(sn.metadata.hasPendingWrites)return;
 if(CMETA){SY.meta=hs(CMETA);const m=clean(CMETA);let ch=false;['plan','chk','handle'].forEach(k=>{if(m[k]!==undefined&&hs(S[k])!==hs(m[k])){S[k]=m[k];ch=true}});if(ch){normalize();persistS();renderSoon()}persistSY()}
 if(!sn.metadata.fromCache&&!PUSHING)setSync('ok')}
function tryReady(){if(!CR&&RDY.trades&&RDY.notes&&RDY.accts&&RDY.meta)reconcile()}
/* First merge after sign-in: 3-way per item (local copy / last-synced hash / cloud copy) */
function reconcile(){let changed=false;
 COLS.forEach(c=>{const C=CLD[c],sy=SY[c],L=new Map(S[c].map(x=>[x.id,x])),out=[];
  Object.keys(C).forEach(id=>{const cd=C[id],h=hs(cd),l=L.get(id);
   if(!l){if(sy[id]!==undefined&&sy[id]===h){/* deleted here since last sync: flush removes it from the cloud */}else{out.push(fixR(c,clean(cd)));sy[id]=h;changed=true}}
   else{const lh=hs(l);
    if(lh===h){sy[id]=h;out.push(l)}
    else if(sy[id]!==undefined&&lh!==sy[id]){out.push(l)}                       /* edited here: flush uploads it */
    else{out.push(fixR(c,clean(cd)));sy[id]=h;changed=true}}});               /* cloud is newer */
  L.forEach((l,id)=>{if(C[id]!==undefined)return;
   if(sy[id]!==undefined&&hs(l)===sy[id]){delete sy[id];changed=true}          /* deleted on another device */
   else out.push(l)});                                                          /* new here: flush uploads it */
  S[c]=out});
 const lm=hs(metaOf());
 if(CMETA){const ch=hs(CMETA);if(lm===ch)SY.meta=ch;else if(SY.meta&&lm!==SY.meta){}else{const m=clean(CMETA);['plan','chk','handle'].forEach(k=>{if(m[k]!==undefined)S[k]=m[k]});SY.meta=ch;changed=true}}
 CR=true;clearTimeout(WT);normalize();persistS();persistSY();if(changed)renderSoon();cloudFlush()}
function cloudSchedule(ms){if(!CR||!UID)return;clearTimeout(PT);setSync('sync');PT=setTimeout(cloudFlush,ms==null?800:ms)}
async function cloudFlush(){if(!CR||!DB||!UID)return;if(PUSHING){AGAIN=true;return}
 const uid=UID,base=DB.collection('users').doc(uid),ops=[];
 COLS.forEach(c=>{const cur=new Map();S[c].forEach(x=>{if(x&&x.id!=null)cur.set(x.id,x)});
  cur.forEach((x,id)=>{const h=hs(x);if(SY[c][id]!==h)ops.push({k:'set',c,id,h,ref:base.collection(c).doc(did(id)),data:clean(x)})});
  Object.keys(SY[c]).forEach(id=>{if(!cur.has(id))ops.push({k:'del',c,id,ref:base.collection(c).doc(did(id))})})});
 const mh=hs(metaOf());if(SY.meta!==mh)ops.push({k:'meta',h:mh,ref:base.collection('meta').doc('main'),data:clean(metaOf())});
 if(!ops.length){setSync(navigator.onLine?'ok':'off');return}
 PUSHING=true;setSync('sync');
 try{for(let i=0;i<ops.length;i+=400){const part=ops.slice(i,i+400),b=DB.batch();
   part.forEach(o=>o.k=='del'?b.delete(o.ref):b.set(o.ref,o.data));
   await b.commit();
   if(UID!==uid||!CR)return;
   part.forEach(o=>{if(o.k=='set')SY[o.c][o.id]=o.h;else if(o.k=='del')delete SY[o.c][o.id];else SY.meta=o.h});persistSY()}
  setSync('ok')}
 catch(e){onErr(e)}
 finally{PUSHING=false;if(AGAIN&&UID===uid&&CR){AGAIN=false;cloudSchedule(300)}}}
/* re-render after a remote change, but never while the user is typing in a field */
function renderSoon(){clearTimeout(RT);RT=setTimeout(()=>{if(!UNL)return;const a=document.activeElement,m=document.querySelector('main');if(a&&m&&/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)&&m.contains(a)){renderSoon();return}render()},300)}
addEventListener('online',()=>{if(UID){setSync('sync');if(CR)cloudSchedule(200)}});
addEventListener('offline',()=>{if(UID)setSync('off')});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&CR){clearTimeout(PT);cloudFlush()}});


/* ===== Live New York clock + active session pill ===== */
const NYF=new Intl.DateTimeFormat('en-US',{timeZone:'America/New_York',hour12:false,hour:'2-digit',minute:'2-digit',second:'2-digit',weekday:'short',timeZoneName:'short'});
function nyTick(){try{const P={};NYF.formatToParts(new Date()).forEach(x=>P[x.type]=x.value);const h=(+P.hour)%24,m=+P.minute,mins=h*60+m,day=P.weekday;
 const closed=day=='Sat'||(day=='Fri'&&mins>=17*60)||(day=='Sun'&&mins<18*60);
 let name,cls2='';if(closed){name='Market Closed';cls2='off'}
 else if(h>=20||h<2)name='Asia';else if(h<9)name='New York';else if(h<12)name='NY AM Killzone';else if(h<16)name='NY PM';else{name='Off-Session';cls2='idle'}
 $('nyClk').textContent=P.hour+':'+P.minute+':'+P.second+' '+(P.timeZoneName||'ET');$('nySes').textContent=name;$('nyDot').className='dot '+cls2}catch(e){}}
