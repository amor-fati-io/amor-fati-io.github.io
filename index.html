<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fenring Journal</title>
<link id="fav" rel="icon" href="data:,">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:dark}
body{background:#050505;color:#fff;font-family:Inter,system-ui,sans-serif;min-height:100vh}
html{background:#050505}
body:before{display:none}
body.hasbg,body.hasbg #bg-media-container,body.hasbg main,body.hasbg #app{background:transparent!important}
body.hasbg .glass{background:rgba(0,0,0,.7)}
body.hasbg header.glass{background:radial-gradient(circle at 15% 50%,rgba(213,184,190,.14),transparent 50%),rgba(0,0,0,.7)}
.glass{background:rgba(0,0,0,.75);border:1px solid rgba(255,255,255,.08);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border-radius:16px}
header.glass{background:radial-gradient(circle at 15% 50%,rgba(213,184,190,.14),transparent 50%),rgba(0,0,0,.75)}
body.hasbg:before{display:none}
.stg{font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;border-radius:99px;padding:1px 8px;border:1px solid}
.brand{font-family:'Cormorant Garamond',Georgia,serif;letter-spacing:.2em;text-transform:uppercase;color:#f3eee6;text-shadow:0 0 18px rgba(213,184,190,.35)}
.inp{background:#0c0c0e;border:1px solid rgba(255,255,255,.1);border-radius:10px;padding:8px 10px;width:100%;font-size:14px;outline:none;color:#fff}
.inp:focus{border-color:#10b981}
.btn{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);border-radius:10px;padding:7px 12px;font-size:13px;cursor:pointer;white-space:nowrap;color:#fff}
.btn:hover{background:rgba(255,255,255,.12)}
.pri{background:#10b981;color:#031;border-color:#10b981;font-weight:600}.pri:hover{background:#34d399}
.pill{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);border-radius:999px;padding:5px 13px;font-size:12px;cursor:pointer}
.tag{background:rgba(16,185,129,.12);color:#6ee7b7;border-radius:8px;padding:2px 9px;font-size:11px;cursor:pointer}
.g{color:#10b981}.r{color:#ef4444}
.tab{padding:8px 14px;border-radius:10px;font-size:13px;color:#a1a1aa;cursor:pointer;white-space:nowrap}
.tab.on{background:rgba(16,185,129,.15);color:#fff}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.78);display:flex;align-items:flex-start;justify-content:center;z-index:50;padding:12px;overflow:auto}
.hidden{display:none!important}
.sel{border-color:#10b981!important;box-shadow:0 0 24px rgba(16,185,129,.18)}
body.hide .priv{filter:blur(9px)}
label{font-size:11px;color:#a1a1aa;display:block;margin-bottom:3px}
.bar{height:6px;border-radius:4px}.lbl{font-size:11px;color:#71717a;letter-spacing:.08em;text-transform:uppercase}
</style></head>
<body>
<div id="bg-media-container" style="position:fixed;inset:0;z-index:0;background:#050505;overflow:hidden;pointer-events:none"></div>
<div class="relative z-10 max-w-[1500px] mx-auto px-3 pt-3"><header class="glass px-3 py-2 flex flex-wrap items-center gap-3 justify-between">
  <div id="logoNav" class="flex items-center gap-2" style="height:34px"></div>
  <nav id="nav" class="flex gap-1 overflow-x-auto max-w-full"></nav>
  <div class="flex items-center gap-2">
    <label class="btn cursor-pointer" title="Image (.png .jpg .webp) or looping video (.mp4 .webm)">Background<input type="file" accept="image/png,image/jpeg,image/webp,video/mp4,video/webm,.png,.jpg,.jpeg,.webp,.mp4,.webm" class="hidden" onchange="bgUp(this)"></label><button id="bgX" class="btn hidden" title="Remove background" onclick="bgClr()">&times;</button>
    <button class="btn" onclick="openImp()">Import CSV</button>
    <button class="btn pri" onclick="openTrade()">+ Log Trade</button>
  </div>
</header></div>
<main class="relative z-10 max-w-[1500px] mx-auto px-3 py-3">
<section data-v="dash" class="grid gap-3 lg:grid-cols-[250px_minmax(0,1fr)_290px]">
  <aside class="space-y-3 order-2 lg:order-none"><div id="accts" class="space-y-3"></div></aside>
  <div class="space-y-3 order-1 lg:order-none min-w-0">
    <div id="hero" class="glass"></div>
    <div id="mrow" class="grid grid-cols-2 xl:grid-cols-4 gap-3"></div>
    <div class="grid md:grid-cols-3 gap-3">
      <div class="glass p-4"><div class="lbl mb-2">Cumulative P&amp;L</div><div style="height:200px"><canvas id="c1"></canvas></div></div>
      <div class="glass p-4"><div id="wkT" class="lbl mb-2"></div><div style="height:200px"><canvas id="c2"></canvas></div></div>
      <div class="glass p-4"><div class="lbl mb-2">Trader Radar</div><div style="height:200px"><canvas id="c3"></canvas></div></div>
    </div></div>
  <aside id="right" class="space-y-3 order-3 lg:order-none"></aside>
</section>
<section data-v="journal" class="hidden max-w-3xl mx-auto"><div id="feed"></div></section>
<section data-v="cal" class="hidden max-w-5xl mx-auto"><div class="flex flex-wrap items-center gap-2 mb-3"><button class="btn" onclick="calMv(-1)">&larr;</button><button class="btn" onclick="calMv(1)">&rarr;</button><button class="btn pri ml-auto" onclick="shareCal()">Share Calendar</button></div><div id="calCard" class="glass" style="position:relative;overflow:hidden;border-radius:20px"></div></section>
<section data-v="ana" class="hidden"><div id="anaG" class="grid lg:grid-cols-3 gap-3"></div></section>
<section data-v="prop" class="hidden"><div class="flex justify-between mb-3"><h2 class="font-semibold">Prop Firm Accounts</h2><button class="btn" onclick="openAcct()">+ Add Account</button></div><div id="propG" class="grid md:grid-cols-2 lg:grid-cols-3 gap-3"></div></section>
<section data-v="pad" class="hidden"><div class="grid lg:grid-cols-3 gap-3">
  <div class="glass p-4"><label>Type</label><select id="nT" class="inp mb-2"><option>Pre-market Plan</option><option>Trading Rules</option><option>Post-session Review</option></select><textarea id="nX" rows="9" class="inp" placeholder="Write here..."></textarea><button class="btn pri w-full mt-2" onclick="addNote()">Save Note</button></div>
  <div id="notes" class="lg:col-span-2 space-y-3"></div></div></section>
</main>

<div id="mT" class="modal hidden"><div class="glass p-5 w-full max-w-lg mt-4">
  <div class="flex justify-between mb-3"><b>Log Trade</b><button class="btn" onclick="cls('mT')">&times;</button></div>
  <div id="live" class="text-center py-3 mb-3 rounded-xl bg-white/5"></div>
  <div class="grid grid-cols-2 gap-3">
    <div><label>Account</label><select id="fA" class="inp"></select></div>
    <div><label>Date</label><input id="fD" type="date" class="inp"></div>
    <div><label>Symbol</label><select id="fSy" class="inp" onchange="calc()"><option>MNQ</option><option>NQ</option><option>MES</option><option>ES</option><option>MGC</option><option>GC</option><option value="CUSTOM">Custom</option></select></div>
    <div><label>Direction</label><select id="fDir" class="inp" onchange="calc()"><option>Long</option><option>Short</option></select></div>
    <div id="fCw" class="hidden col-span-2 grid grid-cols-2 gap-3"><div><label>Custom symbol</label><input id="fCs" class="inp" placeholder="CL"></div><div><label>$ per point</label><input id="fM" type="number" step="any" class="inp" oninput="calc()"></div></div>
    <div><label>Contracts</label><input id="fQ" type="number" step="any" value="1" class="inp" oninput="calc()"></div>
    <div><label>Entry Price</label><input id="fEn" type="number" step="any" class="inp" oninput="calc()"></div>
    <div><label>Exit Price</label><input id="fEx" type="number" step="any" class="inp" oninput="calc()"></div>
    <div><label>Stop Loss (optional)</label><input id="fSt" type="number" step="any" class="inp" oninput="calc()"></div>
    <div><label>Setup</label><input id="fSu" class="inp" placeholder="4h FVG"></div>
    <div><label>Session</label><select id="fSe" class="inp"><option>Asia</option><option>London</option><option selected>NY AM</option><option>PM</option><option>Other / Off-Session</option></select></div>
    <div class="col-span-2"><label>Notes</label><textarea id="fN" rows="2" class="inp"></textarea></div>
  </div><button class="btn pri w-full mt-3" onclick="addTrade()">Save Trade</button></div></div>

<div id="mA" class="modal hidden"><div class="glass p-5 w-full max-w-sm mt-8"><div class="flex justify-between mb-3"><b id="aTtl">Add Account</b><button class="btn" onclick="cls('mA')">&times;</button></div>
  <div class="space-y-3"><div><label>Name</label><input id="aN" class="inp" placeholder="Topstep 50K"></div>
  <div><label>Account Stage</label><select id="aSt" class="inp"><option>Evaluation</option><option>Funded</option><option>Live</option><option>Personal</option></select></div>
  <div><label>Account size $</label><input id="aS" type="number" class="inp" value="50000"></div><div><label>Profit target $</label><input id="aT" type="number" class="inp" value="3000"></div><div><label>Max drawdown $</label><input id="aD" type="number" class="inp" value="2000"></div></div>
  <button id="aBtn" class="btn pri w-full mt-3" onclick="addAcct()">Add</button></div></div>

<div id="mI" class="modal hidden"><div class="glass p-5 w-full max-w-sm mt-8"><div class="flex justify-between mb-3"><b>Import Tradovate CSV</b><button class="btn" onclick="cls('mI')">&times;</button></div>
  <div class="space-y-3"><div><label>Target Account</label><select id="iA" class="inp"></select></div>
  <div><label>Tradovate CSV (Performance or Orders export)</label><input id="iF" type="file" accept=".csv,text/csv" class="inp"></div>
  <div id="iM" class="text-xs text-zinc-400"></div></div>
  <button class="btn pri w-full mt-3" onclick="doImp()">Import Trades</button></div></div>

<div id="mC" class="modal hidden"><div class="glass p-4 w-full max-w-5xl mt-4">
  <div class="flex justify-between mb-3"><b>Fenring Card Studio</b><button class="btn" onclick="closeCard()">&times;</button></div>
  <div class="flex flex-wrap gap-4">
    <div id="pvW" class="relative flex-1 min-w-[280px] overflow-hidden"><div id="pv" style="transform-origin:top left;width:720px">
      <div id="card" style="width:720px;height:400px;position:relative;overflow:hidden;border:none !important;outline:none !important;border-radius:0px !important;background:#050505;font-family:Inter,system-ui,sans-serif;color:#fff">
        <canvas id="cv" width="1440" height="800" style="position:absolute;left:0;top:0;width:720px;height:400px"></canvas>
        <div id="ov" style="position:absolute;left:0;top:0;width:720px;height:400px"></div></div></div><button id="spk" class="hidden" onclick="togSpk()" title="Mute / unmute" aria-label="Mute or unmute video" style="position:absolute;right:10px;top:10px;z-index:5;width:34px;height:34px;border-radius:99px;background:rgba(0,0,0,.6);border:1px solid rgba(255,255,255,.18);display:flex;align-items:center;justify-content:center;cursor:pointer;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)"></button></div>
    <div class="w-full md:w-72 space-y-3 text-sm">
      <label class="btn pri block text-center cursor-pointer">Upload Image / Video<input type="file" accept="image/*,video/mp4,video/webm" class="hidden" onchange="upBg(this)"></label>
      <button id="dlb" class="btn pri w-full" onclick="dl()">Download</button></div></div></div></div>

<script>
const $=i=>document.getElementById(i),KEY='fenring_v3',MULT={MNQ:2,NQ:20,MES:5,ES:50,MGC:10,GC:100};
const p2=n=>String(n).padStart(2,'0'),ymd=d=>d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate()),today=()=>ymd(new Date());
const S$=n=>(n==0?'':n<0?'-':'+')+'$'+Math.abs(n).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
const $$=n=>(n<0?'-':'')+'$'+Math.abs(n).toLocaleString('en-US',{maximumFractionDigits:0});
const cl=n=>n>0?'g':n<0?'r':'',esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const cls=i=>$(i).classList.add('hidden'),opn=i=>$(i).classList.remove('hidden');
const byD=(a,b)=>a.date.localeCompare(b.date)||a.o-b.o,mon=d=>{const m=new Date(d);m.setDate(d.getDate()-((d.getDay()+6)%7));return ymd(m)};
const FP='M255 251L998 251L998 472L992 472C975 380 920 284 700 284L640 284C590 284 567 305 567 365L567 570L640 570C760 570 830 520 858 436L862 436L862 750L856 750C835 660 770 604 640 604L567 604L567 835C567 930 620 975 722 989L722 993L255 993L255 989C340 975 386 920 386 835L386 400C386 300 340 268 255 258Z';
const LG=(c,z)=>`<svg viewBox="20 20 60 60" width="${z}" height="${z}" xmlns="http://www.w3.org/2000/svg" style="flex:none;display:block;overflow:visible"><path transform="translate(3.05 3.35) scale(.075)" d="${FP}" fill="#D5B8BE"/></svg>`;
const TK=z=>`<svg width="${z}" height="${z}" viewBox="0 0 24 24" style="flex:none"><path d="M12 1.5l2.6 2 3.3-.2 1 3.1 2.7 1.9-1 3.1 1 3.1-2.7 1.9-1 3.1-3.3-.2-2.6 2-2.6-2-3.3.2-1-3.1L2.4 15l1-3.1-1-3.1 2.7-1.9 1-3.1 3.3.2z" fill="#1d9bf0"/><path d="M8 12.2l2.8 2.8L16.2 9.5" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
const blank=()=>({accts:[],trades:[],notes:[],plan:{lv:'',nar:'',bias:''},chk:{},sel:'all',hide:false,handle:'@username',tag:'',calBg:null});
let calD=new Date(new Date().getFullYear(),new Date().getMonth(),1);
let S,view='dash',CH={},C={img:null},CD=null;

try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){}
if(!S||!S.trades){S=blank()}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
save();
const F=()=>S.sel=='all'?S.trades:S.trades.filter(t=>t.acct==S.sel),AN=id=>(S.accts.find(a=>a.id==id)||{name:'?'}).name;

function stats(a){const w=a.filter(t=>t.pnl>0),l=a.filter(t=>t.pnl<0),net=a.reduce((s,t)=>s+t.pnl,0),gw=w.reduce((s,t)=>s+t.pnl,0),gl=Math.abs(l.reduce((s,t)=>s+t.pnl,0)),dm={};
 a.forEach(t=>dm[t.date]=(dm[t.date]||0)+t.pnl);const dv=Object.values(dm),rw=w.filter(t=>t.r!=null),ra=a.filter(t=>t.r!=null),av=x=>x.length?x.reduce((s,v)=>s+v,0)/x.length:0;
 return{n:a.length,w:w.length,l:l.length,net,wr:a.length?w.length/a.length*100:0,pf:gl?gw/gl:(gw?99:0),aw:w.length?gw/w.length:0,al:l.length?gl/l.length:0,awr:av(rw.map(t=>t.r)),ar:av(ra.map(t=>t.r)),cons:dv.length?dv.filter(v=>v>0).length/dv.length*100:0,disc:a.length?a.filter(t=>t.plan).length/a.length*100:0,dm}}
function prop(a,T){const by={};T.forEach(t=>by[t.date]=(by[t.date]||0)+t.pnl);let b=a.size,pk=a.size;Object.keys(by).sort().forEach(d=>{b+=by[d];pk=Math.max(pk,b)});const fl=Math.min(a.size,pk-a.dd);return{bal:b,floor:fl,room:b-fl,net:b-a.size}}

function nav(){$('nav').innerHTML=[['dash','Dashboard'],['journal','Journal'],['cal','Calendar'],['ana','Analytics'],['prop','Prop Firms'],['pad','Fenring Pad']].map(([k,n])=>`<div class="tab ${k==view?'on':''}" onclick="go('${k}')">${n}</div>`).join('')}
function go(v){view=v;document.querySelectorAll('[data-v]').forEach(s=>s.classList.toggle('hidden',s.dataset.v!=v));nav();render()}
function render(){({dash,journal,cal:calR,ana,prop:propV,pad:notes})[view]()}
function togHide(){S.hide=!S.hide;save();document.body.classList.toggle('hide',S.hide)}
function selA(id){S.sel=id;save();render()}

const STG={Evaluation:'#f59e0b',Funded:'#10b981',Live:'#a855f7',Personal:'#a1a1aa'};
function acctCard(a){const all=a.id=='all',T=all?S.trades:S.trades.filter(t=>t.acct==a.id),n=T.reduce((s,t)=>s+t.pnl,0),st=a.stage||'Evaluation',c=STG[st]||'#a1a1aa';let ex='',bd='',ac='';
 if(!all){const p=prop(a,T),pr=Math.max(0,Math.min(100,n/a.target*100)),rp=Math.max(0,Math.min(100,p.room/a.dd*100));
  ex=`<div class="flex justify-between text-[11px] text-zinc-500 mt-2"><span>Target ${$$(a.target)}</span><span>${pr.toFixed(0)}%</span></div><div class="bar bg-zinc-800"><div class="bar" style="width:${pr}%;background:#10b981"></div></div>
  <div class="flex justify-between text-[11px] text-zinc-500 mt-2"><span>Drawdown room</span><span class="priv">${$$(p.room)}</span></div><div class="bar bg-zinc-800"><div class="bar" style="width:${rp}%;background:${rp<30?'#ef4444':'#6366f1'}"></div></div>`;
  bd=`<span class="stg" style="color:${c};border-color:${c}66;background:${c}22">${st}</span>`;
  ac=`<div class="flex gap-1.5 mt-2"><button class="btn !py-1 !px-2.5 !text-[11px]" onclick="event.stopPropagation();editAcct('${a.id}')">Edit</button><button class="btn !py-1 !px-2.5 !text-[11px] !text-red-400" onclick="event.stopPropagation();delAcct('${a.id}')">Delete</button></div>`}
 return`<div class="glass p-3 cursor-pointer ${S.sel==a.id?'sel':''}" onclick="selA('${a.id}')"><div class="flex justify-between items-center gap-2"><b class="text-sm truncate">${esc(a.name)}</b><span class="priv font-bold text-sm ${cl(n)}">${S$(n)}</span></div><div class="flex items-center gap-2 text-[11px] text-zinc-500 mt-0.5">${bd}<span>${T.length} trades</span></div>${ex}${ac}</div>`}
const allA=()=>({id:'all',name:'All Accounts'});

function dash(){const T=F(),s=stats(T);
 $('accts').innerHTML=S.accts.length?'<div class="lbl">Prop Firm Accounts</div>'+[allA(),...S.accts].map(acctCard).join('')+'<button class="btn w-full" onclick="openAcct()">+ Add Account</button>':'<div class="glass p-5 text-center"><div class="lbl mb-3">0 Accounts</div><div class="text-sm text-zinc-500 mb-4">Add a prop firm account to start journaling.</div><button class="btn pri w-full" onclick="openAcct()">+ Add Account</button></div>';
 $('hero').innerHTML=`<div class="text-center py-7 px-3"><div class="lbl tracking-[.3em]">Total P&amp;L</div><div class="priv text-5xl md:text-7xl font-bold mt-2" style="text-shadow:0 0 40px rgba(255,255,255,.2)">${S$(s.net)}</div><div class="flex justify-center gap-2 mt-4"><span class="pill"><b class="g">${s.w}W</b> / <b class="r">${s.l}L</b></span><button class="pill" onclick="togHide()">Hide P&amp;L</button><button class="pill" onclick="shareAll()">Share Card</button></div>${S.accts.length?'':'<div class="mt-5 text-sm text-zinc-500">0 Accounts · 0 Trades<br><button class="btn pri mt-3" onclick="openAcct()">+ Add Account</button></div>'}</div>`;
 const R=2*Math.PI*34,mx=Math.max(s.aw,s.al,1);
 $('mrow').innerHTML=`<div class="glass p-4"><div class="lbl">Avg Win RR</div><div class="text-2xl font-bold mt-1">${s.awr.toFixed(2)}R</div><div class="relative h-1.5 rounded bg-zinc-800 mt-5"><div class="absolute -top-1 w-3.5 h-3.5 rounded-full bg-emerald-400" style="left:calc(${Math.min(100,s.awr/4*100)}% - 7px);box-shadow:0 0 12px #10b981"></div></div><div class="flex justify-between text-[10px] text-zinc-500 mt-2"><span>0R</span><span>2R</span><span>4R</span></div></div>

function calMv(n){calD=new Date(calD.getFullYear(),calD.getMonth()+n,1);calR()}
function calR(){const y=calD.getFullYear(),m=calD.getMonth(),T=F().filter(t=>t.date.slice(0,7)==y+'-'+p2(m+1)),dm={},dc={};T.forEach(t=>{dm[t.date]=(dm[t.date]||0)+t.pnl;dc[t.date]=(dc[t.date]||0)+1});
 const net=T.reduce((a,t)=>a+t.pnl,0),dv=Object.values(dm),gd=dv.filter(v=>v>0).length,rd=dv.filter(v=>v<0).length,dw=gd+rd?Math.round(gd/(gd+rd)*100):0,last=new Date(y,m+1,0),first=new Date(y,m,1);
 const ws=new Date(y,m,1-((first.getDay()+6)%7));let rows='',wn=0;
